filebeat.inputs:
  # -------------------------
  # Python NDJSON
  # -------------------------
  - type: filestream
    id: python_lab_runlog
    paths:
      - /var/log/python-lab/run.log
    parsers:
      - ndjson:
          target: "py"
          add_error_key: true
    fields_under_root: true
    fields:
      app: python-lab
      service.name: python-lab
      event.dataset: python-lab.runlog
    tags: ["python-lab"]

  # -------------------------
  # local_ai NDJSON
  # -------------------------
  - type: filestream
    id: local_ai_runlog
    paths:
      - /var/log/local_ai/run.log
    parsers:
      - ndjson:
          target: "local_ai"
          add_error_key: true
    fields_under_root: true
    fields:
      app: local-ai
      service.name: local-ai
      event.dataset: local-ai.runlog
    tags: ["local-ai"]

  # -------------------------
  # local_search NDJSON
  # -------------------------
  - type: filestream
    id: local_search_runlog
    paths:
      - /var/log/local_search/run.log
    parsers:
      - ndjson:
          target: "local_search"
          add_error_key: true
    fields_under_root: true
    fields:
      app: local-search
      service.name: local-search
      event.dataset: local-search.runlog
    tags: ["local-search"]

  # -------------------------
  # local_ai_search NDJSON
  # -------------------------
  - type: filestream
    id: local_ai_search_runlog
    paths:
      - /var/log/local_ai_search/run.log
    parsers:
      - ndjson:
          target: "local_ai_search"
          add_error_key: true
    fields_under_root: true
    fields:
      app: local-ai-search
      service.name: local-ai-search
      event.dataset: local-ai-search.runlog
    tags: ["local-ai-search"]

  # -------------------------
  # OpenVPN runtime log
  # -------------------------
  - type: filestream
    id: openvpn_runtime
    paths:
      - /var/log/openvpn/openvpn.log
    fields_under_root: true
    fields:
      service.name: openvpn
      role: vpn-server
      event.dataset: openvpn.runtime
    tags: ["openvpn"]

  # -------------------------
  # OpenVPN status log
  # -------------------------
  - type: filestream
    id: openvpn_status
    paths:
      - /var/log/openvpn/status.log
    fields_under_root: true
    fields:
      service.name: openvpn
      role: vpn-server
      event.dataset: openvpn.status
    tags: ["openvpn"]

processors:
  # ---- Python mapping -> ECS-ish log.* ----
  - if:
      equals:
        service.name: "python-lab"
    then:
      - copy_fields:
          fields:
            - from: py.level
              to: log.level
            - from: py.logger
              to: log.logger
            - from: py.fn
              to: log.origin.function
            - from: py.module
              to: log.origin.file.name
            - from: py.run_id
              to: labels.run_id
            - from: py.event
              to: event.action
            - from: py.message
              to: message
          ignore_missing: true
          fail_on_error: false
      - add_fields:
          target: event
          fields:
            kind: event

  # ---- local_ai mapping -> ECS-ish log.* ----
  - if:
      equals:
        service.name: "local-ai"
    then:
      - copy_fields:
          fields:
            - from: local_ai.level
              to: log.level
            - from: local_ai.logger
              to: log.logger
            - from: local_ai.fn
              to: log.origin.function
            - from: local_ai.module
              to: log.origin.file.name
            - from: local_ai.run_id
              to: labels.run_id
            - from: local_ai.event
              to: event.action
            - from: local_ai.message
              to: message
            - from: local_ai.event_outcome
              to: event.outcome
            - from: local_ai.error_message
              to: error.message
            - from: local_ai.error_type
              to: error.type
            - from: local_ai.elapsed_ms
              to: labels.elapsed_ms
          ignore_missing: true
          fail_on_error: false
      - add_fields:
          target: event
          fields:
            kind: event

  # ---- local_search mapping -> ECS-ish log.* ----
  - if:
      equals:
        service.name: "local-search"
    then:
      - copy_fields:
          fields:
            - from: local_search.level
              to: log.level
            - from: local_search.logger
              to: log.logger
            - from: local_search.fn
              to: log.origin.function
            - from: local_search.module
              to: log.origin.file.name
            - from: local_search.run_id
              to: labels.run_id
            - from: local_search.event
              to: event.action
            - from: local_search.message
              to: message
            - from: local_search.event_outcome
              to: event.outcome
            - from: local_search.error_message
              to: error.message
            - from: local_search.error_type
              to: error.type
            - from: local_search.elapsed_ms
              to: labels.elapsed_ms
          ignore_missing: true
          fail_on_error: false
      - timestamp:
          field: local_search.ts
          target_field: "@timestamp"
          layouts:
            - "2006-01-02T15:04:05Z"
          test:
            - "2026-05-18T12:23:10Z"
          ignore_missing: true
          fail_on_error: false
      - add_fields:
          target: event
          fields:
            kind: event      

  # ---- local_ai_search mapping -> ECS-ish log.* ----
  - if:
      equals:
        service.name: "local-ai-search"
    then:
      - copy_fields:
          fields:
            - from: local_ai_search.level
              to: log.level
            - from: local_ai_search.logger
              to: log.logger
            - from: local_ai_search.fn
              to: log.origin.function
            - from: local_ai_search.module
              to: log.origin.file.name
            - from: local_ai_search.run_id
              to: labels.run_id
            - from: local_ai_search.event
              to: event.action
            - from: local_ai_search.message
              to: message
            - from: local_ai_search.event_outcome
              to: event.outcome
            - from: local_ai_search.error_message
              to: error.message
            - from: local_ai_search.error_type
              to: error.type
            - from: local_ai_search.elapsed_ms
              to: labels.elapsed_ms
          ignore_missing: true
          fail_on_error: false
      - timestamp:
          field: local_ai_search.ts
          target_field: "@timestamp"
          layouts:
            - "2006-01-02T15:04:05Z"
          test:
            - "2026-06-06T10:36:16Z"
          ignore_missing: true
          fail_on_error: false
      - add_fields:
          target: event
          fields:
            kind: event        

  # ---- OpenVPN runtime parsing ----
  - if:
      equals:
        event.dataset: "openvpn.runtime"
    then:
      - add_fields:
          target: event
          fields:
            kind: event

      - dissect:
          tokenizer: "%{openvpn.peer}/%{openvpn.proto}:%{source.ip}:%{source.port} %{openvpn.rest}"
          field: "message"
          target_prefix: ""
          ignore_failure: true

      - dissect:
          tokenizer: "%{}CN=%{tls.client.subject}"
          field: "message"
          target_prefix: ""
          ignore_failure: true

      - script:
          lang: javascript
          id: openvpn_runtime_action_outcome
          source: >
            function process(event) {
              var msg = event.Get("message");
              if (!msg) return;

              if (msg.indexOf("VERIFY OK") !== -1) {
                event.Put("event.action","tls_verify");
                event.Put("event.outcome","success");
                event.Put("openvpn.event","VERIFY_OK");
              } else if (msg.indexOf("VERIFY KU OK") !== -1) {
                event.Put("event.action","tls_verify");
                event.Put("event.outcome","success");
                event.Put("openvpn.event","VERIFY_KU_OK");
              } else if (msg.indexOf("AUTH_FAILED") !== -1) {
                event.Put("event.action","auth");
                event.Put("event.outcome","failure");
                event.Put("openvpn.event","AUTH_FAILED");
              } else if (msg.indexOf("TLS Error") !== -1 || msg.indexOf("TLS_ERROR") !== -1) {
                event.Put("event.action","tls");
                event.Put("event.outcome","failure");
                event.Put("openvpn.event","TLS_ERROR");
              } else if (msg.indexOf("Peer Connection Initiated") !== -1) {
                event.Put("event.action","connect");
                event.Put("event.outcome","success");
                event.Put("openvpn.event","PEER_CONNECTION_INITIATED");
              }
            }

  # ---- OpenVPN status parsing (CLIENT_LIST / ROUTING_TABLE) ----
  - if:
      equals:
        event.dataset: "openvpn.status"
    then:
      - add_fields:
          target: event
          fields:
            kind: metric

      # Parse CLIENT_LIST rows
      - dissect:
          tokenizer: "CLIENT_LIST,%{openvpn.common_name},%{openvpn.real_address},%{openvpn.virtual_address},%{openvpn.virtual_ipv6},%{openvpn.bytes_received},%{openvpn.bytes_sent},%{openvpn.connected_since},%{openvpn.connected_since_epoch},%{openvpn.username},%{openvpn.client_id},%{openvpn.peer_id},%{openvpn.data_cipher}"
          field: "message"
          target_prefix: ""
          ignore_failure: true

      # Parse ROUTING_TABLE rows
      - dissect:
          tokenizer: "ROUTING_TABLE,%{openvpn.virtual_address},%{openvpn.common_name},%{openvpn.real_address},%{openvpn.last_ref},%{openvpn.last_ref_epoch}"
          field: "message"
          target_prefix: ""
          ignore_failure: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.template.enabled: true
logging.level: info
